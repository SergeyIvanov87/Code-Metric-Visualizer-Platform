services:
  file-uploader-functional-tester:
    build:
      context: ../../../..
      dockerfile: utility/file-uploader/tests/functional/Dockerfile
      additional_contexts:
        streaming_file_uploader: "service:file-uploader"
    depends_on:
      - file-uploader
    volumes:
      - file-uploader-api-test:/api
      - file-uploads-test:/uploads
      - type: bind
        source: ${FILE_UPLOADER_STAGING_ROOT:-/dev/shm/file-uploader}
        target: ${FILE_UPLOADER_STAGING_ROOT:-/dev/shm/file-uploader}
