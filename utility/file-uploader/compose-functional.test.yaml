include:
  - tests/compose-functional.test.yaml

services:
  file-uploader:
    build:
      context: ../..
      dockerfile: utility/file-uploader/Dockerfile
    environment:
      - MICROSERVICE_NAME=file-uploader
      - FILE_UPLOADER_STAGING_ROOT=${FILE_UPLOADER_STAGING_ROOT:-/dev/shm/file-uploader}
    volumes:
      - file-uploader-api-test:/api
      - file-uploads-test:/uploads
      - type: bind
        source: ${FILE_UPLOADER_STAGING_ROOT:-/dev/shm/file-uploader}
        target: ${FILE_UPLOADER_STAGING_ROOT:-/dev/shm/file-uploader}

volumes:
  file-uploader-api-test:
  file-uploads-test:
