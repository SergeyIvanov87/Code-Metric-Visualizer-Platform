include:
  - ../../common/proxy_setup_image_helpers/compose-proxy-trust.yaml

services:
  docs_dispatcher:
    extends:
      file: ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
      service: proxy-base
    build:
      context: ../../
      dockerfile: ./ai_agents_framework/docs_dispatcher/Dockerfile
    environment:
       DISPATCHER_BACKEND: ${DISPATCHER_BACKEND:-mysql_persistent}
       BE_MYSQL_PASSWORD_FILE: /run/secrets/backend_mysql_db_password
       BE_MYSQL_LOGIN_FILE: /run/secrets/backend_mysql_db_login
       BE_MYSQL_MYSQL_DATABASE: rag_docs_database
    volumes:
      - api.pmccabe_collector.restapi.org:/api
      - api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.persistent-store-data:/mnt/file_storage
    secrets:
       - backend_mysql_db_login
       - backend_mysql_db_password

volumes:
  api.pmccabe_collector.restapi.org:
    name: api.pmccabe_collector.restapi.org
    external: true
  api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.persistent-store-data:

secrets:
   backend_mysql_db_login:
     file: sources/backend/interfaces_impl/access/mysql/default_user.txt
   backend_mysql_db_password:
     file: sources/backend/interfaces_impl/access/mysql/default_pwd.txt
