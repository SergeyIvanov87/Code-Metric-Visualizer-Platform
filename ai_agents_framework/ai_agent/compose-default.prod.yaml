include:
  - ../../common/proxy_setup_image_helpers/compose-proxy-trust.yaml

# use these section of extend the service proxy-base
# via ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
x-proxy-vars: &proxy-vars
  HTTP_PROXY: ${HTTP_PROXY}
  HTTPS_PROXY: ${HTTPS_PROXY}
  http_proxy: ${http_proxy}
  https_proxy: ${https_proxy}
  NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},localhost,127.0.0.1,0.0.0.0"
  no_proxy: "${no_proxy:-${NO_PROXY:-localhost,127.0.0.1}},localhost,127.0.0.1,0.0.0.0"

services:
  ai_agent:
    extends:
      file: ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
      service: proxy-base
    build:
      context: ../..
      dockerfile: ai_agents_framework/ai_agent/Dockerfile
      args:
        LLM_BACKEND: cpu
      secrets:
        - proxy_ca
    environment:
      VECTORDB_HOST: rag-db
      VECTORDB_PORT: 8000
      SKIP_API_DEPS_CHECK: ${SKIP_API_DEPS_CHECK:-false}
      TIMEOUT_FOR_DEPS_CHECK_BEFORE_TERMINATION_SEC: ${TIMEOUT_FOR_DEPS_CHECK_BEFORE_TERMINATION_SEC:-30}
    networks:
      - api.pmccabe_collector.network
    volumes:
      - ./config:/config:ro
      - api.pmccabe_collector.restapi.org:/api

  rag-db:
    extends:
      file: ../RAG/compose.yaml
      service: rag-db
    networks:
      - api.pmccabe_collector.network
    volumes:
      - api.pmccabe_collector.project.ai-agents-framework.rag-vectordb-data:/mnt

  rag-doc-storage-dispatcher:
    extends:
      file: ../docs_dispatcher/compose-default.prod.yaml
      service: docs_dispatcher
    volumes:
      - api.pmccabe_collector.restapi.org:/api
      - api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.config:/etc/dispatcher
      - api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.persistent-store-data:/mnt/file_storage

  file-uploader:
    extends:
      file: ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
      service: proxy-base
    build:
      context: ../../utility/file-uploader
      dockerfile: Dockerfile
      additional_contexts:
        common: ../../common
      secrets:
        - proxy_ca
    volumes:
      - api.pmccabe_collector.restapi.org:/api

networks:
  api.pmccabe_collector.network:
    name: api.pmccabe_collector.network
    external: true

secrets:
   backend_mysql_db_login:
     file: ../docs_dispatcher/sources/backend/interfaces_impl/access/mysql/default_user.txt
   backend_mysql_db_password:
     file: ../docs_dispatcher/sources/backend/interfaces_impl/access/mysql/default_pwd.txt

volumes:
  api.pmccabe_collector.project.ai-agents-framework.rag-vectordb-data:
  api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.persistent-store-data:
  api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.config:
  api.pmccabe_collector.restapi.org:
    name: api.pmccabe_collector.restapi.org
    external: true
