include:
  - ../../common/proxy_setup_image_helpers/compose-proxy-trust.yaml

# use these section of extend the service proxy-base
# via ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
x-proxy-vars: &proxy-vars
  HTTP_PROXY: ${HTTP_PROXY}
  HTTPS_PROXY: ${HTTPS_PROXY}
  http_proxy: ${http_proxy}
  https_proxy: ${https_proxy}
  NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},localhost,127.0.0.1,0.0.0.0"
  no_proxy: "${no_proxy:-${NO_PROXY:-localhost,127.0.0.1}},localhost,127.0.0.1,0.0.0.0"

services:
  ai_agent:
    extends:
      file: ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
      service: proxy-base
    build:
      context: ../..
      dockerfile: ai_agents_framework/ai_agent/Dockerfile.dev
      secrets:
        - proxy_ca
      args:
        VECTORDB_HOST: rag-db
        VECTORDB_PORT: 8000
        SKIP_API_DEPS_CHECK: ${SKIP_API_DEPS_CHECK:-false}
        TIMEOUT_FOR_DEPS_CHECK_BEFORE_TERMINATION_SEC: ${TIMEOUT_FOR_DEPS_CHECK_BEFORE_TERMINATION_SEC:-30}
    volumes:
      - api.pmccabe_collector.restapi.org:/api
      - api.pmccabe_collector.project.ai-agents-framework.ai-agent.src:/package

  file-uploader:
    extends:
      file: ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
      service: proxy-base
    build:
      context: ../../utility/file-uploader
      dockerfile: Dockerfile
      additional_contexts:
        common: ../../common
      secrets:
        - proxy_ca
    environment:
      <<: *proxy-vars
    volumes:
      - api.pmccabe_collector.restapi.org:/api

volumes:
  api.pmccabe_collector.restapi.org:
    name: api.pmccabe_collector.restapi.org
    external: true
  api.pmccabe_collector.project.ai-agents-framework.ai-agent.src:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sources
