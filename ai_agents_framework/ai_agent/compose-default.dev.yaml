services:
  ai_agent:
    build:
      context: ../..
      dockerfile: ai_agents_framework/ai_agent/Dockerfile.dev
    environment:
      VECTORDB_HOST: rag-db
      VECTORDB_PORT: 8000
      SKIP_API_DEPS_CHECK: ${SKIP_API_DEPS_CHECK:-false}
      TIMEOUT_FOR_DEPS_CHECK_BEFORE_TERMINATION_SEC: ${TIMEOUT_FOR_DEPS_CHECK_BEFORE_TERMINATION_SEC:-30}
    volumes:
      - api.pmccabe_collector.restapi.org:/api
      - api.pmccabe_collector.project.ai-agents-framework.ai-agent.src:/package
      - api.pmccabe_collector.project.ai-agents-framework.ai-agent.models:/assets/models

  file-uploader:
    build:
      context: ../../utility/file-uploader
      dockerfile: Dockerfile
      additional_contexts:
        common: ../../common
    volumes:
      - api.pmccabe_collector.restapi.org:/api

volumes:
  api.pmccabe_collector.restapi.org:
  api.pmccabe_collector.project.ai-agents-framework.ai-agent.models:
  api.pmccabe_collector.project.ai-agents-framework.ai-agent.src:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./sources
