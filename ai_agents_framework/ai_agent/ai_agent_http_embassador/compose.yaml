services:
  ai-agent-http-ambassador:
    build:
      context: ../../..
      dockerfile: ai_agents_framework/ai_agent/ai_agent_http_embassador/Dockerfile
    environment:
      AI_AGENT_HTTP_CONFIG: /app/config.json
      HTTP_BIND: 0.0.0.0:8081
    volumes:
      - api.pmccabe_collector.restapi.org:/api
      - ./config.json:/app/config.json:ro
    expose:
      - "8081"
    networks:
      - api.pmccabe_collector.network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  api.pmccabe_collector.restapi.org:
    name: api.pmccabe_collector.restapi.org
    external: true

networks:
  api.pmccabe_collector.network:
    name: api.pmccabe_collector.network
    external: true
