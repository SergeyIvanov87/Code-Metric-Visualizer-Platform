<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a RAG document</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='rag_add.js') }}"></script>
</head>
<body>
  <main>
    <nav><a href="{{ chat_path }}">Chat with the knowledge base</a></nav>
    <h1>Add a document</h1>
    <p>Select a UTF-8 text file to add it to the knowledge base.</p>
    <label for="file">Browse file</label>
    <input id="file" type="file" accept=".txt,.md,.csv,.json,.log,text/*">
    <p id="status" role="status"></p>
    <pre id="result"></pre>
  </main>
</body>
</html>
