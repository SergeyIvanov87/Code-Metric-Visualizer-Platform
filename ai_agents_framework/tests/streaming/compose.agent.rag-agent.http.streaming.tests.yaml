# Test overlay for compose.rag-agent.http.streaming.yaml.
# The HTTP stack uses the external API volume shared by rest_api, the ambassador,
# and the agent, so this overlay must not use the private rag-agent-api volume
# from the non-HTTP streaming test topology.
services:
  rag-doc-storage-dispatcher:
    depends_on:
      rag-document-storage-permissions:
        condition: service_healthy

  rag-document-storage-permissions:
    image: alpine:3.20.6
    command: >
      sh -ec "mkdir -p /mnt/file_storage;
      chmod -R 0777 /mnt/file_storage;
      touch /tmp/ready;
      exec tail -f /dev/null"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 1s
      retries: 10
    logging: &streaming-logging
      driver: syslog
      options: { syslog-address: "tcp://localhost:13601", tag: "{{.Name}}" }
    networks:
      - api.pmccabe_collector.network
    volumes:
      - rag-document-storage:/mnt/file_storage

  test_pseudo_fs:
    extends:
      file: ../common/images/test_pseudo_fs/compose.yaml
      service: test_pseudo_fs
    logging: *streaming-logging
    networks:
      - api.pmccabe_collector.network

  ai-agent-rag-functional-tester:
    build:
      context: ..
      dockerfile: ai_agents_framework/ai_agent/test/Dockerfile
      additional_contexts:
        test_pseudo_fs: service:test_pseudo_fs
    environment:
      EXIT_ONCE_DONE: "true"
    depends_on:
      rag-agent:
        condition: service_started
      test_pseudo_fs:
        condition: service_started
    logging: *streaming-logging
    networks:
      - api.pmccabe_collector.network
    volumes:
      - api.pmccabe_collector.restapi.org:/api
