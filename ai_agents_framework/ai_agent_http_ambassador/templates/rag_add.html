<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a RAG document</title>
  <style nonce="{{ csp_nonce }}">{{ page_style|safe }}</style>
</head>
<body>
  <main>
    <nav>
      <a href="{{ main_menu_path }}">Return to the main menu</a>
      {% for link in navigation %}<a href="{{ link.path }}">{{ link.label }}</a>{% endfor %}
    </nav>
    <h1>Add a document</h1>
    <p>Select a file to add it to the knowledge base.</p>
    <label for="file">Browse file</label>
    <input id="file" type="file">
    <p id="status" role="status"></p>
    <pre id="result"></pre>
  </main>
  <script nonce="{{ csp_nonce }}">
    const requestMethod = {{ request_method|tojson }};
    const requestParameters = {{ request_parameters|tojson }};
    {{ page_script|safe }}
  </script>
</body>
</html>
