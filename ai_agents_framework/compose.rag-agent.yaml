include:
  - ../common/images/test_aggregator_image/compose.yaml

services:
  syslog-ng:
    build:
      context: ../
      dockerfile: ./common/images/syslog-ng_image/Dockerfile
    env_file:
      - path: ../common/images/syslog-ng_image/.env
        required: true
    environment:
      - PUID=0
      - PGID=0
      - TZ= # timezone
    container_name: api.pmccabe_collector.syslog-ng
    hostname: api.pmccabe_collector.syslog-ng
    volumes:
      - api.pmccabe_collector.logger.org:/var/log
    ports:
      - 1514:5514/udp
      - 1601:6601/tcp
    restart: unless-stopped
    networks:
      - api.pmccabe_collector.network
    logging:
      driver: "json-file"

  rag-agent:
    extends:
      file: ./ai_agent/compose-default.prod.yaml
      service: ai_agent
    depends_on:
      - syslog-ng
    hostname: rag-agent
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network
    volumes:
      - api.pmccabe_collector.restapi.org:/api

  file-uploader:
    build:
      context: ../utility/file-uploader
      dockerfile: Dockerfile
      additional_contexts:
        common: ../common
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network
    volumes:
      - api.pmccabe_collector.restapi.org:/api
      - file-uploads:/uploads

  rest-api:
    build:
      context: ../rest_api
      dockerfile: Dockerfile.isolated
      additional_contexts:
        common: ../common
    environment:
      - FLASK_RUN_PORT=${FLASK_RUN_PORT:-5000}
      - FLASK_RUN_HOST=${FLASK_RUN_HOST:-0.0.0.0}
    hostname: rest-api
    depends_on:
      syslog-ng:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network
    volumes:
      - api.pmccabe_collector.restapi.org:/api
    ports:
      - 5000:5000

  ai-agent-http-ambassador:
    extends:
      file: ./ai_agent_http_ambassador/compose.yaml
      service: ai-agent-http-ambassador
    build:
      context: ..
      dockerfile: ai_agents_framework/ai_agent_http_ambassador/Dockerfile
    depends_on:
      syslog-ng:
        condition: service_started
    volumes:
      - api.pmccabe_collector.restapi.org:/api
      - ./ai_agent_http_ambassador/config.json:/app/config.json:ro
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  http-api-gateway-controller:
    extends:
      file: ../fs_api_proxy/http_api_gateway/compose.yaml
      service: http-api-gateway-controller
    build:
      context: ..
      dockerfile: fs_api_proxy/http_api_gateway/Dockerfile.controller
    environment:
      BACKENDS_FOR_FRONTENDS: http://rest-api:5000,http://ai-agent-http-ambassador:8081
    depends_on:
      syslog-ng:
        condition: service_started
    volumes:
      - http-api-gateway-config:/var/lib/http-api-gateway
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  http-api-gateway:
    extends:
      file: ../fs_api_proxy/http_api_gateway/compose.yaml
      service: http-api-gateway
    depends_on:
      syslog-ng:
        condition: service_started
    volumes:
      - http-api-gateway-config:/var/lib/http-api-gateway:ro
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  rag-db:
    extends:
      file: ./RAG/compose.yaml
      service: rag-db
    depends_on:
      - syslog-ng
    hostname: rag-db
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    ports:
      - 8000:8000
    volumes:
      - api.pmccabe_collector.project.ai-agents-framework.rag.db:/mnt
    networks:
      - api.pmccabe_collector.network

  rag-doc-storage-dispatcher:
    extends:
      file: ./docs_dispatcher/compose-default.prod.yaml
      service: docs_dispatcher
    depends_on:
      - syslog-ng
    hostname: rag-doc-storage-dispatcher
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:1601"
        tag: "{{.Name}}"
    volumes:
      - api.pmccabe_collector.restapi.org:/api
    networks:
      - api.pmccabe_collector.network


networks:
  api.pmccabe_collector.network:
    name: api.pmccabe_collector.network
    external: true

secrets:
   backend_mysql_db_login:
     file: ./docs_dispatcher/sources/backend/mysql/default_user.txt
   backend_mysql_db_password:
     file: ./docs_dispatcher/sources/backend/mysql/default_pwd.txt


volumes:
  api.pmccabe_collector.logger.org:
    name: api.pmccabe_collector.logger.org
    external: true
  api.pmccabe_collector.restapi.org:
    name: api.pmccabe_collector.restapi.org
    external: true
  api.pmccabe_collector.project.ai-agents-framework.ai-agent.models:
  api.pmccabe_collector.project.ai-agents-framework.rag.db:
  api.pmccabe_collector.restapi.org.ai-agents-framework.docs-dispatcher.persistent.storage:
  file-uploads:
  http-api-gateway-config:
