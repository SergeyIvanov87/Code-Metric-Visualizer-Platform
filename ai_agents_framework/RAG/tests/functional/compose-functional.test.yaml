services:
  rag-functional-tester:
    build:
      context: ../../../../
      dockerfile: ./ai_agents_framework/RAG/tests/functional/Dockerfile

    environment:
      - EXIT_ONCE_DONE=true
      - RAG_URI=rag-host-test:8000
    networks:
      - api.pmccabe_collector.network
    volumes:
      - api.pmccabe_collector.project.ai-agents-framework.rag.test:/mnt
    depends_on:
       - rag
