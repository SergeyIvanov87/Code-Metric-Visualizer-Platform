include:
  - ../../common/proxy_setup_image_helpers/compose-proxy-trust.yaml

services:
  rag-db:
    extends:
      file: ../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
      service: proxy-base
    build:
      context: ../../
      dockerfile: ./ai_agents_framework/RAG/Dockerfile
    hostname: rag-db-host
    volumes:
      - api.pmccabe_collector.project.ai-agents-framework.rag-vectordb-data:/mnt
    networks:
      - api.pmccabe_collector.network


networks:
  api.pmccabe_collector.network:
    name: api.pmccabe_collector.network
    external: false

volumes:
    api.pmccabe_collector.project.ai-agents-framework.rag-vectordb-data:
