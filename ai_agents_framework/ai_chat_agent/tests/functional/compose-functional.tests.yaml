include:
  - ../../../../common/images/test_pseudo_fs/compose.yaml
  - ../../../../common/proxy_setup_image_helpers/compose-proxy-trust.yaml
  - test_RAG/compose-functional.tests.yaml


services:
  ai-chat-agent-functional-tester:
    extends:
      file: ../../../../common/proxy_setup_image_helpers/compose-proxy-args.yaml
      service: proxy-base
    build:
      context: ../../../../
      dockerfile: ai_agents_framework/ai_chat_agent/tests/functional/Dockerfile
      additional_contexts:
        test_pseudo_fs: "service:test_pseudo_fs"
    environment:
      - EXIT_ONCE_DONE=true
    volumes:
      - api.pmccabe_collector.restapi.org.ai-chat-agent.tests:/api
    depends_on:
       - ai_chat_agent
       - test_pseudo_fs

volumes:
  api.pmccabe_collector.restapi.org.ai-chat-agent.tests:
