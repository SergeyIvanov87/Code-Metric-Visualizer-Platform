services:
  http-query-dispatcher:
    image: envoyproxy/envoy:v1.36.0
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${HTTP_QUERY_DISPATCHER_PORT:-8080}:8080"
    networks:
      - api.pmccabe_collector.network
    restart: unless-stopped

networks:
  api.pmccabe_collector.network:
    name: api.pmccabe_collector.network
    external: true
