include:
  - common/compose-common.yaml
  - common/proxy_setup_image_helpers/compose-proxy-trust.yaml

services:
  cc-visualizer:
    extends:
      file: cyclomatic_complexity/compose-functional.test.yaml
      service: cc-visualizer
    depends_on:             # explicit dependency
      test_aggregator:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  cc-functional-tester:
    extends:
      file: cyclomatic_complexity/tests/functional/compose-functional.test.yaml
      service: cc-functional-tester
    environment:
      - EXIT_ONCE_DONE=false
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  rrd-analytic:
    extends:
      file: rrd_analytic/compose-functional.test.yaml
      service: rrd-analytic
    depends_on:
      - cc-visualizer
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  rrd-functional-tester:
    extends:
      file: rrd_analytic/tests/functional/compose-functional.test.yaml
      service: rrd-functional-tester
    environment:
      - EXIT_ONCE_DONE=false
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  rest-api:
    extends:
      file: rest_api/compose-functional.test.yaml
      service: rest-api
    depends_on:
      - cc-visualizer
      - rrd-analytic
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  docs-dispatcher:
    extends:
      file: ai_agents_framework/docs_dispatcher/compose-functional.prod.yaml
      service: docs-dispatcher
    depends_on:             # explicit dependency
      test_aggregator:
        condition: service_healthy
      docs-dispatcher-file-storage-permissions:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  docs-dispatcher-file-storage-permissions:
    image: alpine:3.20.6
    user: root
    command: >
      sh -ec "
        mkdir -p /mnt/file_storage;
        chmod -R 0777 /mnt/file_storage;
        touch /tmp/ready;
        exec tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 1s
      retries: 10
    volumes:
      - api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.persistent-store-data.test:/mnt/file_storage
    networks:
      - api.pmccabe_collector.network

  rag:
    extends:
      file: ai_agents_framework/RAG/compose-functional.test.yaml
      service: rag
    depends_on:             # explicit dependency
      test_aggregator:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  ai_agent:
    extends:
      file: ai_agents_framework/ai_agent/compose-functional.test.yaml
      service: ai_agent
    depends_on:             # explicit dependency
      test_aggregator:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  test-rag-db:
    extends:
      file: ai_agents_framework/ai_agent/tests/functional/test_RAG/compose-functional.tests.yaml
      service: test-rag-db
    environment:
      - CHROMA_PORT=18000
    hostname: test-rag-db
    volumes:
      - api.pmccabe_collector.project.ai-agents-framework.rag-vectordb-data.test:/mnt

  file-uploader:
    extends:
      file: ai_agents_framework/ai_agent/compose-default.prod.yaml
      service: file-uploader
    volumes:
      - api.pmccabe_collector.restapi.org.ai-agents-framework.rag-dispatcher.test:/api
    depends_on:
      test_aggregator:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  ai_agent-functional-tester:
    extends:
      file: ai_agents_framework/ai_agent/tests/functional/compose-functional.tests.yaml
      service: ai_agent-functional-tester
    depends_on:
      ai_agent:
        condition: service_started
      test_pseudo_fs:
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  ai_chat_agent:
    extends:
      file: ai_agents_framework/ai_chat_agent/compose-functional.test.yaml
      service: ai_chat_agent
    depends_on:             # explicit dependency
      test_aggregator:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  ai-chat-agent-functional-tester:
    extends:
      file: ai_agents_framework/ai_chat_agent/tests/functional/compose-functional.tests.yaml
      service: ai-chat-agent-functional-tester
    depends_on:
      ai_chat_agent:
        condition: service_started
      test_pseudo_fs:
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  rest-api-functional-api-initializer:
    extends:
      file: rest_api/tests/functional/api_initializer/compose-functional.test.yaml
      service: rest-api-functional-api-initializer
    depends_on:
      test_aggregator:      # explicit dependency
        condition: service_healthy
    environment:
      - EXIT_ONCE_DONE=false
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  rest-api-functional-service-tester:
    extends:
      file: rest_api/tests/functional/service_tester/compose-functional.test.yaml
      service: rest-api-functional-service-tester
    depends_on:             # explicit dependency
      test_aggregator:
        condition: service_healthy
    environment:
      - EXIT_ONCE_DONE=false
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  service-broker:
    extends:
      file: service_broker/compose-functional.test.yaml
      service: service-broker
    depends_on:
      - cc-visualizer
      - rrd-analytic
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

  service-broker-functional-tester:
    extends:
      file: service_broker/tests/functional/compose-functional.test.yaml
      service: service-broker-functional-tester
    environment:
      - EXIT_ONCE_DONE=false
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://localhost:13601"
        tag: "{{.Name}}"
    networks:
      - api.pmccabe_collector.network

networks:
  api.pmccabe_collector.network:
    name: api.pmccabe_collector.network
    external: true

volumes:
  test_aggregator_logs_storage:
  api.pmccabe_collector.project.cc.test:
  api.pmccabe_collector.restapi.org.cc.test:
  api.pmccabe_collector.project.rrd.test:
  api.pmccabe_collector.rrd.rrd-analytic:
  api.pmccabe_collector.restapi.org.rrd.test:
  api.pmccabe_collector.restapi.org.rest-api.test:
  api.pmccabe_collector.restapi.org.service-broker.test:
  api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.persistent-store-data.test:
  api.pmccabe_collector.restapi.org.ai-agents-framework.rag-dispatcher.test:
  api.pmccabe_collector.restapi.org.ai-agent.tests:
  api.pmccabe_collector.project.ai-agents-framework.rag-dispatcher.config.test:
  api.pmccabe_collector.project.ai-agents-framework.rag.test:
  api.pmccabe_collector.project.ai-agents-framework.ai-agent.models.test:
  api.pmccabe_collector.project.ai-agents-framework.rag-vectordb-data.test:
  api.pmccabe_collector.restapi.org.ai-chat-agent.tests:

secrets:
   backend_mysql_db_login:
     file: ai_agents_framework/docs_dispatcher/tests/backend_mysql_default_user.txt
   backend_mysql_db_password:
     file: ai_agents_framework/docs_dispatcher/tests/backend_mysql_default_pwd.txt
