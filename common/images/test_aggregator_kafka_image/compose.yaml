services:
  test_aggregator:
    build:
      context: ../../../
      dockerfile: common/images/test_aggregator_kafka_image/Dockerfile
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-test-capture-events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-test-aggregator}
      CAPTURE_ID: ${CAPTURE_ID:-functional-test}
      MAX_WAIT_SECONDS: ${MAX_WAIT_SECONDS:-900}
    volumes:
      - test_aggregator_logs:/logs

volumes:
  test_aggregator_logs:
