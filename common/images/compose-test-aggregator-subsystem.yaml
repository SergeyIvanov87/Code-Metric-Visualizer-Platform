# One ID scopes the entire ephemeral execution. The default supports a simple
# clean/manual launch; controllers should set a unique value for repeated runs.
name: test-aggregator-${TEST_EXECUTION_ID:-functional-test}

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
          --create --if-not-exists --topic test-capture-events --partitions 1
          --replication-factor 1 >/dev/null 2>&1 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
          --describe --topic test-capture-events >/dev/null 2>&1
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 10s
    networks:
      - log.test.streaming.subsystem.network


  proxy-ready:
    image: curlimages/curl:8.16.0
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "60"
      - --retry-all-errors
      - --retry-delay
      - "1"
      - http://envoy:9901/ready
    networks:
      - envoy.admin.channel.network

  tap_subscriber:
    build:
      context: ../..
      dockerfile: common/images/streaming_test_aggregator/tap_subscriber/Dockerfile
    environment:
      ENVOY_ADMIN_HOST: envoy
      ENVOY_ADMIN_PORT: 9901
      ENVOY_TAP_CONFIG_ID: test_aggregator
      WAIT_FOR_NEXT_TAP_BEFORE_FINISH_MSEC: 15000
      WAIT_FOR_FIRST_TAP_BEFORE_FINISH_MSEC: 60000
      MAX_WAIT_MSEC_UNTIL_FINISH: 600000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_DELIVERY_TIMEOUT_SECONDS: 120
      KAFKA_TOPIC: test-capture-events
      CAPTURE_ID: ${TEST_EXECUTION_ID:-functional-test}
    volumes:
      - streaming-test-aggregator-logs:/logs
    depends_on:
      proxy-ready: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      log_event_aggregator: { condition: service_healthy }
    networks:
      - envoy.admin.channel.network
      - log.test.streaming.subsystem.network

  log_event_aggregator:
    build:
      context: ../..
      dockerfile: common/images/streaming_test_aggregator/log_event_aggregator/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_STARTUP_TIMEOUT_SECONDS: 120
      KAFKA_CONSUMER_RETRY_BACKOFF_SECONDS: 1
      KAFKA_TOPIC: test-capture-events
      KAFKA_CONSUMER_GROUP: log-event-aggregator-${TEST_EXECUTION_ID:-functional-test}
      CAPTURE_ID: ${TEST_EXECUTION_ID:-functional-test}
      MAX_WAIT_SECONDS: 180
    volumes:
      - streaming-test-aggregator-logs:/logs
    depends_on:
      kafka: { condition: service_healthy }
    networks:
      - log.test.streaming.subsystem.network


volumes:
  streaming-test-aggregator-logs:

networks:
  api.pmccabe_collector.network:
    name: api.pmccabe_collector.network
    external: true

  envoy.admin.channel.network:
    name: envoy.admin.channel.network
    external: true

  log.test.streaming.subsystem.network:
