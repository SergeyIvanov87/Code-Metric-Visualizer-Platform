@version: 4.3
@include "scl.conf"

source s_local {
  internal();
};

source s_network_tcp {
  # Docker opens one syslog connection per logging container. The network()
  # source otherwise accepts only its low default number of simultaneous
  # clients, so containers above that limit repeatedly reconnect and Envoy
  # necessarily emits hundreds of one-connection TAP files for them.
  network(transport(tcp) port(6601) max-connections(1000));
};

source s_network_udp {
  syslog(transport(udp) port(5514));
};

destination d_local {
  file("/var/log/messages" perm(0644));
  file("/var/log/messages-kv.log" template("$ISODATE $HOST $(format-welf --scope all-nv-pairs)\n") frac-digits(3));
};

log {
  source(s_local);
  source(s_network_tcp);
  source(s_network_udp);
  destination(d_local);
};

@include "/config/volatile.conf"
