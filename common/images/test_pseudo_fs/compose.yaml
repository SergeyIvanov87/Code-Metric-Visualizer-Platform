      context: ../../../
      dockerfile: common/images/test_pseudo_fs/Dockerfile
      secrets:
        - proxy_ca
    image: test_pseudo_fs
    environment:
        - EXIT_ONCE_DONE=${EXIT_ONCE_DONE:-true}
