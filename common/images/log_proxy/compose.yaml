services:
  envoy:
    build:
      context: ../../..
      dockerfile: common/images/log_proxy/Dockerfile
    env_file:
      - path: ./.env
        required: true
    environment:
        - ENVOY_ADMIN_PORT=${ENVOY_ADMIN_PORT:-9901}
        - MAX_BUFFERED_RX_BYTES=${MAX_BUFFERED_RX_BYTES:-4294967295}
        - UPSTREAM_AGGREGATOR_TCP_PORT=${UPSTREAM_AGGREGATOR_TCP_PORT:-13601}
        - HOST_UPSTREAM_AGGREGATOR_TCP_PORT=${HOST_UPSTREAM_AGGREGATOR_TCP_PORT:-13601}
        # Use the Compose service alias for container-to-container DNS. The
        # DOWNSTREAM_SYSLOG_HOSTNAME value from syslog-ng's .env is its custom
        # container name and is not a portable DNS name.
        - DOWNSTREAM_SYSLOG_HOSTNAME=${DOWNSTREAM_SYSLOG_HOSTNAME:-api.pmccabe_collector.syslog-ng}
        - DOWNSTREAM_SYSLOG_TCP_PORT=${DOWNSTREAM_SYSLOG_TCP_PORT:-6601}
        - DOWNSTREAM_SSH_SECRET=${DOWNSTREAM_SSH_SECRET:-syslog-ng}
    depends_on:
      # TODO added -streaming
      - syslog-ng-streaming
    networks:
      - api.pmccabe_collector.network
    ports:
      - "${HOST_UPSTREAM_AGGREGATOR_TCP_PORT:-13601}:${UPSTREAM_AGGREGATOR_TCP_PORT:-13601}/tcp"

  envoy-ready:
    image: curlimages/curl:8.16.0
    env_file:
      - path: ./.env
        required: true
    environment:
        - ENVOY_ADMIN_PORT=${ENVOY_ADMIN_PORT:-9901}
        # Use the Compose service alias for container-to-container DNS. The
        # DOWNSTREAM_SYSLOG_HOSTNAME value from syslog-ng's .env is its custom
        # container name and is not a portable DNS name.
        - DOWNSTREAM_SYSLOG_HOSTNAME=api.pmccabe_collector.syslog-ng
    command:
      - --fail
      - --silent
      - --show-error
      - --retry
      - "60"
      - --retry-all-errors
      - --retry-delay
      - "1"
      - http://envoy:${ENVOY_ADMIN_PORT:-9901}/ready
    depends_on:
      envoy: { condition: service_started }
    networks:
      - api.pmccabe_collector.network
