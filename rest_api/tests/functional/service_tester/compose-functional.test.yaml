services:
  rest-api-functional-service-tester:
    build:
      context: ../../../../
      dockerfile: rest_api/tests/functional/service_tester/Dockerfile
      secrets:
        - source: test_pseudo_fs_proxy_ca
          target: proxy_ca
      additional_contexts:
        test_pseudo_fs: "service:test_pseudo_fs"
    environment:
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},localhost,127.0.0.1,rest-api"
      no_proxy: "${no_proxy:-${NO_PROXY:-localhost,127.0.0.1}},localhost,127.0.0.1,rest-api"
    volumes:
      - api.pmccabe_collector.restapi.org.rest-api.test:/api
    depends_on:
      - rest-api
      - test_pseudo_fs

volumes:
  api.pmccabe_collector.restapi.org.rest-api.test:
