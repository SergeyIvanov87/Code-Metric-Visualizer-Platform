services:
  rest-api-functional-api-initializer:
    build:
      context: ../../../../
      dockerfile: rest_api/tests/functional/api_initializer/Dockerfile
      secrets:
        - source: test_pseudo_fs_proxy_ca
          target: proxy_ca
      additional_contexts:
        test_pseudo_fs: "service:test_pseudo_fs"
    volumes:
      - api.pmccabe_collector.restapi.org.rest-api.test:/api
    depends_on:
      - test_pseudo_fs

volumes:
  api.pmccabe_collector.restapi.org.rest-api.test:
