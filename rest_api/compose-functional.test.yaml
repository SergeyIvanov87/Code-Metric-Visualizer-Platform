include:
  - tests/compose-functional.test.yaml

services:
  rest-api:
    build:
      context: ../
      dockerfile: ./rest_api/Dockerfile
      secrets:
        - source: rest_api_proxy_ca
          target: proxy_ca
    secrets:
      - source: rest_api_proxy_ca
        target: proxy_ca
    environment:
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},localhost,127.0.0.1,0.0.0.0,rest-api"
      no_proxy: "${no_proxy:-${NO_PROXY:-localhost,127.0.0.1}},localhost,127.0.0.1,0.0.0.0,rest-api"
    hostname: rest-api
    volumes:
      - api.pmccabe_collector.restapi.org.rest-api.test:/api
    ports:
      - 5000:5000
    depends_on:
      - rest-api-functional-api-initializer

volumes:
  api.pmccabe_collector.restapi.org.rest-api.test:

secrets:
  rest_api_proxy_ca:
    file: ${PROXY_CA_FILE:-./empty-proxy-ca.pem}
