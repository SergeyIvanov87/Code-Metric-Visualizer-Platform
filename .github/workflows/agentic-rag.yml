name: Agentic RAG CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test_agentic_rag:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Get current date
      id: date
      shell: bash
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
    - name: Clear docker environment
      run: docker image prune -f && docker container prune -f && docker image ls -a && docker container ls -a
    - name: Build AI RAG docs dispatcher Docker image[prod]
      run: docker build -f ai_agents_framework/docs_dispatcher/Dockerfile -t docs-dispatcher:$DATE .
      env:
        DATE: ${{ steps.date.outputs.date }}
    - name: Test AI RAG docs dispatcher Docker image[prod]
      run: docker compose -f ai_agents_framework/docs_dispatcher/compose-functional.prod.yaml up --remove-orphans --abort-on-container-exit --exit-code-from docs-dispatcher-functional-tester
    - name: Test AI RAG impl
      run: docker compose -f ai_agents_framework/RAG/compose-functional.test.yaml up --remove-orphans --abort-on-container-exit --exit-code-from rag-functional-tester
    - name: Build AI agent Docker image
      run: docker build -f ai_agents_framework/ai_agent/Dockerfile -t ai-agent:$DATE .
      env:
        DATE: ${{ steps.date.outputs.date }}
    - name: Test AI agent RAG filesystem API
      run: docker compose -f ai_agents_framework/ai_agent/test/compose-functional.prod.yaml up --remove-orphans --abort-on-container-exit --exit-code-from ai_agent_rag_functional_tester
    - name: Collect Agentic RAG diagnostics and clean up
      if: always()
      shell: bash
      run: |
        set +e
        diagnostics="${RUNNER_TEMP}/agentic-rag-diagnostics"
        mkdir -p "${diagnostics}"
        for compose_file in \
          ai_agents_framework/docs_dispatcher/compose-functional.prod.yaml \
          ai_agents_framework/RAG/compose-functional.test.yaml \
          ai_agents_framework/ai_agent/test/compose-functional.prod.yaml; do
          slug=$(echo "${compose_file}" | tr '/.' '--')
          docker compose -f "${compose_file}" ps --all > "${diagnostics}/${slug}-ps.txt" 2>&1
          docker compose -f "${compose_file}" logs --no-color > "${diagnostics}/${slug}-logs.txt" 2>&1
          docker compose -f "${compose_file}" config > "${diagnostics}/${slug}-config.yaml" 2>&1
          docker compose -f "${compose_file}" down --volumes --remove-orphans || true
        done
    - name: Upload Agentic RAG diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agentic-rag-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/agentic-rag-diagnostics
        if-no-files-found: warn
        retention-days: 14
