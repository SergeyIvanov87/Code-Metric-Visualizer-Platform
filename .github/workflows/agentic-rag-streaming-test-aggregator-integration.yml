name: Agentic RAG Streaming Test Aggregator Integration CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test_agentic_rag_with_streaming_aggregator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_EXECUTION_ID: agentic-rag-${{ github.run_id }}-${{ github.run_attempt }}
      # Keep the single capture open across all three sequential RAG suites.
      WAIT_FOR_FIRST_TAP_BEFORE_FINISH_MSEC: 1800000
      WAIT_FOR_NEXT_TAP_BEFORE_FINISH_MSEC: 1800000
      MAX_WAIT_MSEC_UNTIL_FINISH: 2400000
      MAX_WAIT_SECONDS: 2400

    steps:
    - uses: actions/checkout@v4
    - name: Get current date
      id: date
      shell: bash
      run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
    - name: Clear docker environment
      run: docker image prune -f && docker container prune -f && docker image ls -a && docker container ls -a
    - name: Prepare shared Docker resources
      shell: bash
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/log" "${RUNNER_TEMP}/agentic-rag-streaming-diagnostics"
        chmod 777 "${GITHUB_WORKSPACE}/log"
        docker network create -d bridge api.pmccabe_collector.network
        docker volume create -d local -o type=none -o device="${GITHUB_WORKSPACE}/log" -o o=bind api.pmccabe_collector.logger.org
        docker volume create api.pmccabe_collector.restapi.org
        docker volume create api.pmccabe_collector.project.ai-agents-framework.rag.db
    - name: Build AI RAG docs dispatcher Docker image[prod]
      run: docker build -f ai_agents_framework/docs_dispatcher/Dockerfile -t docs-dispatcher:$DATE .
      env:
        DATE: ${{ steps.date.outputs.date }}
    - name: Build AI agent Docker image
      run: docker build -f ai_agents_framework/ai_agent/Dockerfile -t ai-agent:$DATE .
      env:
        DATE: ${{ steps.date.outputs.date }}
    - name: Build all required services, including Agentic RAG
      shell: bash
      run: |
        set -euo pipefail
        docker compose -f ai_agents_framework/docs_dispatcher/compose-functional.prod.yaml build
        docker compose -f ai_agents_framework/RAG/compose-functional.test.yaml build
        docker compose -f ai_agents_framework/ai_agent/test/compose-functional.prod.yaml build
        docker compose -f ai_agents_framework/compose-overrides/streaming-logger/compose.rag-agent.yaml build
        docker compose -f common/images/compose-logger-subsystem.yaml build
        docker compose -f common/images/compose-test-aggregator-subsystem.yaml build
      env:
        DATE: ${{ steps.date.outputs.date }}
    - name: Launch streaming logger and test aggregator subsystems
      shell: bash
      run: |
        set -euo pipefail
        docker compose -f common/images/compose-logger-subsystem.yaml up --detach \
          syslog-ng-streaming envoy envoy-ready
        docker compose -f common/images/compose-test-aggregator-subsystem.yaml up --detach \
          kafka proxy-ready log_event_aggregator tap_subscriber
    - name: Launch Agentic RAG services
      run: docker compose -f ai_agents_framework/compose-overrides/streaming-logger/compose.rag-agent.yaml up --detach --remove-orphans rag-db rag-doc-storage-dispatcher rag-agent
    - name: Test AI RAG docs dispatcher Docker image[prod]
      run: >-
        docker compose
        -f ai_agents_framework/docs_dispatcher/compose-functional.prod.yaml
        -f ai_agents_framework/compose-overrides/streaming-logger/tests/compose.docs-dispatcher.yaml
        up --abort-on-container-exit --exit-code-from docs-dispatcher-functional-tester
    - name: Test AI RAG impl
      run: >-
        docker compose
        -f ai_agents_framework/RAG/compose-functional.test.yaml
        -f ai_agents_framework/compose-overrides/streaming-logger/tests/compose.rag.yaml
        up --abort-on-container-exit --exit-code-from rag-functional-tester
    - name: Test AI agent RAG filesystem API
      run: >-
        docker compose
        -f ai_agents_framework/ai_agent/test/compose-functional.prod.yaml
        -f ai_agents_framework/compose-overrides/streaming-logger/tests/compose.ai-agent.yaml
        up --abort-on-container-exit --exit-code-from ai_agent_rag_functional_tester
    - name: Finish streaming capture after all Agentic RAG tests
      shell: bash
      run: |
        set -euo pipefail
        docker compose -f common/images/compose-test-aggregator-subsystem.yaml \
          stop --timeout 180 tap_subscriber
    - name: Verify aggregated Agentic RAG test logs
      shell: bash
      run: |
        set -euo pipefail
        aggregator_id=$(docker compose -f common/images/compose-test-aggregator-subsystem.yaml ps --all --quiet log_event_aggregator)
        test -n "${aggregator_id}"
        aggregator_exit_code=$(docker wait "${aggregator_id}")
        if [[ "${aggregator_exit_code}" != "0" ]]; then
          docker compose -f common/images/compose-test-aggregator-subsystem.yaml logs --no-color log_event_aggregator
          exit "${aggregator_exit_code}"
        fi
    - name: Collect integration diagnostics and clean up
      if: always()
      shell: bash
      run: |
        set +e
        diagnostics="${RUNNER_TEMP}/agentic-rag-streaming-diagnostics"
        mkdir -p "${diagnostics}/logger-volume" "${diagnostics}/aggregator"
        cp -a "${GITHUB_WORKSPACE}/log/." "${diagnostics}/logger-volume/" 2>/dev/null || true
        docker compose -f common/images/compose-test-aggregator-subsystem.yaml cp \
          log_event_aggregator:/logs/. "${diagnostics}/aggregator/" 2>/dev/null || true
        for compose_file in \
          ai_agents_framework/compose-overrides/streaming-logger/compose.rag-agent.yaml \
          common/images/compose-logger-subsystem.yaml \
          common/images/compose-test-aggregator-subsystem.yaml; do
          slug=$(echo "${compose_file}" | tr '/.' '--')
          docker compose -f "${compose_file}" ps --all > "${diagnostics}/${slug}-ps.txt" 2>&1
          docker compose -f "${compose_file}" logs --no-color > "${diagnostics}/${slug}-logs.txt" 2>&1
        done
        docker compose -f ai_agents_framework/docs_dispatcher/compose-functional.prod.yaml -f ai_agents_framework/compose-overrides/streaming-logger/tests/compose.docs-dispatcher.yaml down --volumes --remove-orphans || true
        docker compose -f ai_agents_framework/RAG/compose-functional.test.yaml -f ai_agents_framework/compose-overrides/streaming-logger/tests/compose.rag.yaml down --volumes --remove-orphans || true
        docker compose -f ai_agents_framework/ai_agent/test/compose-functional.prod.yaml -f ai_agents_framework/compose-overrides/streaming-logger/tests/compose.ai-agent.yaml down --volumes --remove-orphans || true
        docker compose -f ai_agents_framework/compose-overrides/streaming-logger/compose.rag-agent.yaml down --remove-orphans || true
        docker compose -f common/images/compose-test-aggregator-subsystem.yaml down --volumes --remove-orphans || true
        docker compose -f common/images/compose-logger-subsystem.yaml down --volumes --remove-orphans || true
        docker volume rm api.pmccabe_collector.restapi.org api.pmccabe_collector.project.ai-agents-framework.rag.db 2>/dev/null || true
        docker network rm api.pmccabe_collector.network 2>/dev/null || true
    - name: Upload Agentic RAG streaming diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agentic-rag-streaming-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/agentic-rag-streaming-diagnostics
        if-no-files-found: warn
        retention-days: 14
