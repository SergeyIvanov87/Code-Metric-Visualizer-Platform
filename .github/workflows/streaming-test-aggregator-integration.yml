name: Streaming Test Aggregator Integration CI ("Simian Army")

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  functional_testing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Clear docker environment
      run: docker image prune -f && docker container prune -f && docker image ls -a && docker container ls -a
    - name: Create Shared network
      run: docker network create -d bridge api.pmccabe_collector.network
    - name: Prepare shared volume for SYSLOG-NG
      run: rm -rf ${GITHUB_WORKSPACE}/log && mkdir -p ${GITHUB_WORKSPACE}/log && chmod 777 ${GITHUB_WORKSPACE}/log && docker volume create -d local -o type=none -o device=${GITHUB_WORKSPACE}/log -o o=bind api.pmccabe_collector.logger.org
    - name: Run streaming test aggregator integrational tests
      shell: bash
      run: |
        set -euo pipefail
        compose_logger_subsystem_file="common/images/compose-logger-subsystem.yaml"
        compose_logger_test_aggregator_subsystem_file="common/images/compose-test-aggregator-subsystem.yaml"
        compose_tests_file="common/images/compose-functional-tests-test-aggregator-subsystem.yaml"
        diagnostics="${RUNNER_TEMP}/streaming-test-aggregator-integration-diagnostics"

        cleanup() {
          status=$?
          mkdir -p "${diagnostics}"
          docker compose -f "${compose_logger_test_aggregator_subsystem_file}" cp \
            log_event_aggregator:/logs/aggregator/. \
            "${diagnostics}/aggregator" 2>/dev/null || true
          docker compose -f "${compose_logger_test_aggregator_subsystem_file}" cp \
            log_event_aggregator:/logs/syslog-streams/. \
            "${diagnostics}/syslog-streams" 2>/dev/null || true
          docker compose -f "${compose_logger_test_aggregator_subsystem_file}" cp \
            log_event_aggregator:/logs/subscriber/. \
            "${diagnostics}/subscriber" 2>/dev/null || true
          docker compose -f "${compose_logger_test_aggregator_subsystem_file}" ps --all || true
          docker compose -f "${compose_logger_test_aggregator_subsystem_file}" logs --no-color --tail 200 \
            log_event_aggregator tap_subscriber || true
          docker compose -f "${compose_tests_file}" down --volumes --remove-orphans || true
          docker compose -f "${compose_logger_test_aggregator_subsystem_file}" down --volumes --remove-orphans || true
          docker compose -f "${compose_logger_subsystem_file}" down --volumes --remove-orphans || true
          exit "${status}"
        }
        trap cleanup EXIT

        docker compose -f "${compose_logger_subsystem_file}" build
        docker compose -f "${compose_logger_subsystem_file}" up --detach --remove-orphans \
          syslog-ng-streaming envoy envoy-ready

        docker compose -f "${compose_logger_test_aggregator_subsystem_file}" build
        docker compose -f "${compose_logger_test_aggregator_subsystem_file}" up --detach --remove-orphans \
          kafka proxy-ready log_event_aggregator tap_subscriber

        docker compose -f "${compose_tests_file}" build
        docker compose -f "${compose_tests_file}" up --detach --remove-orphans \
          passed-tester skipped-tester mixed-tester

        aggregator_id=$(docker compose -f "${compose_logger_test_aggregator_subsystem_file}" ps --all --quiet log_event_aggregator)
        if [[ -z "${aggregator_id}" ]]; then
          echo "The log_event_aggregator container was not created" >&2
          exit 1
        fi

        aggregator_exit_code=$(docker wait "${aggregator_id}")
        if [[ "${aggregator_exit_code}" != "0" ]]; then
          echo "::error::log_event_aggregator exited with ${aggregator_exit_code}"
          echo "::group::log_event_aggregator diagnostics"
          docker compose -f "${compose_logger_test_aggregator_subsystem_file}" logs --no-color log_event_aggregator || true
          docker compose -f "${compose_tests_file}" run --rm --no-deps \
            --entrypoint sh functional-tests -c \
            'for file in /logs/aggregator/*; do echo "===== ${file} ====="; cat "${file}"; done' || true
          echo "::endgroup::"
          exit "${aggregator_exit_code}"
        fi

        docker compose -f "${compose_tests_file}" run --rm --no-deps functional-tests

    - name: Upload streaming test aggregator integration diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: streaming-test-aggregator-integration-diagnostics
        path: ${{ runner.temp }}/streaming-test-aggregator-integration-diagnostics
        if-no-files-found: warn
